    { title: 'ADR-1 — Drag drop-target resolution via document.elementFromPoint (not e.target)',
      problem: 'setPointerCapture redirects e.target back to the drag source during a pointer move, so the drop handler read targetId === sourceId and moveElement never fired in headless runs — drag-and-drop was green in CI but inert in real flows.',
      options: 'Keep reading e.target and special-case capture; release pointer capture mid-drag; resolve the drop target geometrically via document.elementFromPoint at the drop coordinates.',
      decision: 'Resolve the drop target via document.elementFromPoint at the drop coordinates, independent of pointer capture.',
      rationale: 'It reflects what is actually under the cursor regardless of capture redirection, works identically headless and interactive, and unblocked the rest of the move pipeline (cross-parent reparent, card-swap). (HYP-31, #501)' },
    { title: 'ADR-2 — app-mode is a render-failure FALLBACK, not an upfront guess',
