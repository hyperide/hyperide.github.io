name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify report attribution and evidence
        run: python3 scripts/ci/check-own-results.py

      - name: Verify the HyperIDE product report against its evidence record
        run: python3 scripts/ci/check-product-report.py

      - name: Make sure ffprobe is available to decode the recordings
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Verify screenshots, original requests and recordings
        run: python3 scripts/ci/check-media-report.py

      - name: Verify the native-stage proof block and record
        run: python3 scripts/ci/check-native-stage-proof.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate changed report pages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run ci:validate-reports

      - name: Check October reports render without JavaScript and on phones
        run: npm run ci:render-october

      - name: Check screenshots, original requests and recordings render and play
        run: npm run ci:render-media
